<!DOCTYPE html>
<!--
  AI 判讀回饋 — 轉送頁（GitHub Pages）
  告警卡片的按鈕開這頁，頁面在背景以「不帶登入身分」呼叫 Google Apps Script 寫入回饋，再自己顯示結果。
  為什麼需要：手機瀏覽器登入 Google 帳號時，直接開 Apps Script 會顯示「雲端硬碟：目前無法開啟這個檔案」（資料其實有寫入）。
  本頁不含任何金鑰；簽章由 n8n 產生、Apps Script 驗證。原始檔：IT-Monitoring-Agent/github-pages/index.html
-->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>AI 判讀回饋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#E1002B; --bg:#2B2320; --surface:#352B27; --text:#F5F2F1; --muted:#9a9a9a;
    --border:rgba(255,255,255,.09); --ok:#3ecf8e; --warn:#f5a623;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Roboto',-apple-system,'Noto Sans TC','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--text);
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;-webkit-font-smoothing:antialiased}
  .c{background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--brand);border-radius:10px;
     padding:28px 28px 22px;width:100%;max-width:520px}
  .brand{font-size:12px;color:var(--muted);letter-spacing:.6px;margin-bottom:14px}
  h1{font-size:22px;font-weight:700;margin-bottom:14px;line-height:1.4}
  h1.ok{color:var(--ok)} h1.bad{color:#ff5c7a} h1.warn{color:var(--warn)} h1.wait{color:var(--text)}
  p{font-size:15px;line-height:1.7;color:#e8dfda;word-break:break-word}
  p.k{color:var(--muted);font-size:14px}
  .msg{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);color:var(--muted);font-size:14px}
  a{color:#ff5c7a}
  .spin{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--brand);border-radius:50%;
        animation:s 1s linear infinite;vertical-align:-3px;margin-right:8px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="c">
  <div class="brand">AI 判讀回饋</div>
  <h1 id="t" class="wait"><span class="spin"></span>記錄中…</h1>
  <div id="d"></div>
</div>
<script>
  // Apps Script 網頁應用程式網址（換部署網址時改這裡）
  var EXEC = 'https://script.google.com/macros/s/AKfycbzYvsqi3VzaHpIZKD-dGxB8P8MQzBn2lARZw1flGVfGG22KqTf-sTdHK-bssAxoN96Nqg/exec';

  var t = document.getElementById('t'), d = document.getElementById('d');
  function line(text, cls) { var p = document.createElement('p'); if (cls) p.className = cls; p.textContent = text; d.appendChild(p); return p; }
  function show(title, cls, lines, msg) {
    t.className = cls; t.textContent = title; d.innerHTML = '';
    (lines || []).forEach(function (l) { line(l); });
    if (msg) { var m = line(msg); m.className = 'msg'; }
  }

  var q = location.search;
  var params = new URLSearchParams(q);
  if (!params.get('eid') || !params.get('sig')) {
    show('這個頁面要從 Teams 告警卡片的按鈕開啟', 'warn', [], '直接開啟本頁不會記錄任何資料。');
  } else {
    // credentials:'omit'：不帶 Google 登入 Cookie，避開「目前無法開啟這個檔案」
    fetch(EXEC + q, { credentials: 'omit', cache: 'no-store', redirect: 'follow' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (txt) {
        var ls = txt.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
        var st = ls.find(function (l) { return /^(✅|❌|⚠️)/.test(l); }) || '';
        var cls = st.indexOf('✅') === 0 ? 'ok' : st.indexOf('❌') === 0 ? 'bad' : 'warn';
        var title = st.replace(/^(✅|❌|⚠️)\s*/, '') || '回應格式不正確';
        var info = ls.filter(function (l) { return l !== st && l !== 'AI 判讀回饋' && /：/.test(l) && l.length < 200; });
        var msg = ls.filter(function (l) { return l !== st && l !== 'AI 判讀回饋' && info.indexOf(l) < 0; }).join(' ');
        show((cls === 'ok' ? '✅ ' : cls === 'bad' ? '❌ ' : '⚠️ ') + title, cls, info, msg);
      })
      .catch(function (e) {
        show('⚠️ 無法連線到記錄服務', 'warn', ['（' + e.message + '）'], '');
        var p = line('', 'msg');
        p.appendChild(document.createTextNode('可以改用 '));
        var a = document.createElement('a'); a.href = EXEC + q; a.textContent = '直接開啟記錄網址'; a.rel = 'noreferrer';
        p.appendChild(a);
        p.appendChild(document.createTextNode('（若出現「無法開啟檔案」，回饋通常仍已記錄）。'));
      });
  }
</script>
</body>
</html>
